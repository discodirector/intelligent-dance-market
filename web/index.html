<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Intelligent Dance Market</title>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="brand">
          <span class="brand-mark">IDM</span>
          <span class="brand-sub">every trade is a note · IDM/IMD</span>
        </div>
        <div class="mode" id="mode">demo</div>
        <button id="start" type="button">start audio</button>
      </header>
      <div class="bezel">
        <canvas id="grid" aria-label="IDM grid"></canvas>
      </div>
      <footer>
        <p id="info">96 · A/Dorian · swap #0 · page #0</p>
        <p id="epoch">EPOCH #0 · Dub Techno</p>
        <p id="idle">IDLE 0s · FULL</p>
        <div id="gallery" hidden></div>
        <div class="transport" id="transport" hidden>
          <label>speed <input id="speed" type="number" min="0.25" max="200000" step="0.25" value="1" /> ×</label>
          <button id="fit" type="button">fit 48s</button>
        </div>
        <p id="status" class="status"></p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
