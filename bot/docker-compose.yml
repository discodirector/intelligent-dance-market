# Deployed at /opt/swarm-sequencer/bot/docker-compose.yml; secrets in /opt/swarm-sequencer/.env (bot)
# and /opt/swarm-sequencer/pulse.env (keeper, from bot/pulse.env.example). Both chmod 600, never in the image.
name: swarm-sequencer
services:
  bot:
    build:
      context: ..
      dockerfile: bot/Dockerfile
    image: swarm-sequencer-bot:latest
    container_name: swarm-sequencer-bot
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      OUT_DIR: /app/out
    volumes:
      - ../out:/app/out
    shm_size: "512m"
    mem_limit: 2g
    cpus: 1.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Pulse keeper (src/pulse.ts): same image, needs only LIVE_RPC_URL + PULSE_TREASURY (+ PULSE_KEY to send).
  # Dry run unless pulse.env sets PULSE_SEND=true. Behind a profile, so `docker compose up -d` starts only the bot;
  # start it after launch with `docker compose --profile pulse up -d pulse`.
  pulse:
    image: swarm-sequencer-bot:latest
    container_name: swarm-sequencer-pulse
    profiles: ["pulse"]
    command: ["npx", "tsx", "src/pulse.ts"]
    restart: unless-stopped
    # Own env file: the keeper gets no X / Anthropic keys, the bot never gets PULSE_KEY.
    env_file:
      - ../pulse.env
    mem_limit: 384m
    cpus: 0.25
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
