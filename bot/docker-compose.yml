# Deployed at /opt/swarm-sequencer/bot/docker-compose.yml; secrets in /opt/swarm-sequencer/.env
name: swarm-sequencer
services:
  bot:
    build:
      context: ..
      dockerfile: bot/Dockerfile
    image: swarm-sequencer-bot:latest
    container_name: swarm-sequencer-bot
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      OUT_DIR: /app/out
    volumes:
      - ../out:/app/out
    shm_size: "512m"
    mem_limit: 2g
    cpus: 1.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
