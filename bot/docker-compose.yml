# Deployed at /opt/swarm-sequencer/bot/docker-compose.yml; secrets in /opt/swarm-sequencer/.env (bot)
# and /opt/swarm-sequencer/pulse.env (keeper, from bot/pulse.env.example); the stations API's settings in
# /opt/swarm-sequencer/api.env (from bot/api.env.example); the stations worker's in /opt/swarm-sequencer/stations.env (from
# bot/stations.env.example, the only file with SWARM_KEY). All chmod 600, never in the image.
name: swarm-sequencer
services:
  bot:
    build:
      context: ..
      dockerfile: bot/Dockerfile
    image: swarm-sequencer-bot:latest
    container_name: swarm-sequencer-bot
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      OUT_DIR: /app/out
    volumes:
      - ../out:/app/out
    shm_size: "512m"
    mem_limit: 2g
    cpus: 1.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Stations API (src/api/index.ts, docs/STATIONS.md "Applications and payment"): same image, read-only on chain, no
  # keys. Own env file (STATION_PAY_TO, STATIONS_OPEN, STATION_PRICE_TIER), the bot's out/ for applications/ and
  # stations-data/status.json. Published on the host's loopback only: Caddy proxies /api/* to it. Behind a profile:
  # `docker compose --profile api up -d api`.
  api:
    image: swarm-sequencer-bot:latest
    container_name: swarm-sequencer-api
    profiles: ["api"]
    command: ["npx", "tsx", "src/api/index.ts"]
    restart: unless-stopped
    env_file:
      - ../api.env
    environment:
      OUT_DIR: /app/out
      API_HOST: 0.0.0.0
      API_PORT: "8787"
    ports:
      - "127.0.0.1:8797:8787"  # host 8787 is taken by another service on the VPS
    volumes:
      - ../out:/app/out
    mem_limit: 384m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Stations pipeline worker (src/stations/worker.ts, docs/STATIONS.md "Automatic pipeline"): paid application ->
  # runtime registry entry -> swarm job paid from the hot wallet (SWARM_KEY) -> gate (Chromium, web/dist gate.html)
  # -> preview -> live; Telegram notifications and the owner's commands. Own env file: the only service with
  # SWARM_KEY. Behind a profile: `docker compose --profile stations up -d stations`.
  stations:
    image: swarm-sequencer-bot:latest
    container_name: swarm-sequencer-stations
    profiles: ["stations"]
    command: ["npx", "tsx", "src/stations/worker.ts"]
    restart: unless-stopped
    env_file:
      - ../stations.env
    environment:
      OUT_DIR: /app/out
    volumes:
      - ../out:/app/out
    shm_size: "512m"
    mem_limit: 1536m
    cpus: 1.0
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Hamster telemetry recorder (src/hamster/recorder.ts): polls the Squeekchain API (/v1/status every second,
  # /v1/events every 30 s; public, no key) and appends to /opt/swarm-sequencer/hamster (status-YYYY-MM-DD.jsonl,
  # events.jsonl). No env file, no secrets, no out/. Behind a profile: `docker compose --profile hamster up -d hamster`;
  # day stats: `docker exec swarm-sequencer-hamster npx tsx src/hamster/stats.ts [YYYY-MM-DD]`.
  hamster:
    image: swarm-sequencer-bot:latest
    container_name: swarm-sequencer-hamster
    profiles: ["hamster"]
    command: ["npx", "tsx", "src/hamster/recorder.ts"]
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      HAMSTER_DIR: /data/hamster
    volumes:
      - ../hamster:/data/hamster
    mem_limit: 256m
    cpus: 0.25
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Pulse keeper (src/pulse.ts): same image, needs only LIVE_RPC_URL + PULSE_TREASURY (+ PULSE_KEY to send).
  # Dry run unless pulse.env sets PULSE_SEND=true. Behind a profile, so `docker compose up -d` starts only the bot;
  # start it after launch with `docker compose --profile pulse up -d pulse`.
  pulse:
    image: swarm-sequencer-bot:latest
    container_name: swarm-sequencer-pulse
    profiles: ["pulse"]
    command: ["npx", "tsx", "src/pulse.ts"]
    restart: unless-stopped
    # Own env file: the keeper gets no X / Anthropic keys, the bot never gets PULSE_KEY.
    env_file:
      - ../pulse.env
    mem_limit: 384m
    cpus: 0.25
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
