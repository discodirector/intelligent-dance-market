[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
ffi = false
fs_permissions = [{ access = "read-write", path = "../spec/vectors.json" }]
remappings = ["v4-core/=lib/v4-core/", "@uniswap/v4-core/=lib/v4-core/", "v4-periphery/=lib/v4-periphery/", "forge-std/=lib/forge-std/src/", "solmate/=lib/solmate/"]

[profile.default.fuzz]
runs = 512

[fmt]
line_length = 120
